name: Android tests and reports

on:
  pull_request:
  push:
    branches: [Nov, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests and coverage
        run: |
          ./gradlew :app:testDebugUnitTest
          ./gradlew :app:jacocoTestReport

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:connectedDebugAndroidTest :app:createDebugCoverageReport

      - name: Collect Android Allure results
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/allure-results/androidTest
          adb pull /sdcard/googletest/test_outputfiles/allure-results reports/allure-results/androidTest

      - name: Generate Allure HTML report
        if: always()
        continue-on-error: true
        run: ./gradlew :app:allureReport

      - name: Collect Android coverage report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports/coverage/androidTest
          if [ -d app/build/reports/coverage/androidTest ]; then
            cp -R app/build/reports/coverage/androidTest/. reports/coverage/androidTest/
          fi

      - name: Upload Allure and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-test-reports
          path: |
            reports/
            app/build/reports/androidTests/
            app/build/reports/coverage/
          if-no-files-found: warn
          retention-days: 30
